# AEGEX - Mosquitto MQTT honeypot broker (dev settings).
# Anonymous access is ON on purpose: this broker is a decoy for the smoke-detector honeypot, and the point is to
# let unknown clients connect so their behaviour can be logged. Do NOT reuse this file for a real broker.

listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

# Log to stdout (docker logs) and to a file on a shared volume that the AEGEX pipeline tails read-only.
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_timestamp true
log_type error
log_type warning
log_type notice
log_type information
log_type subscribe
log_type unsubscribe
